<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16171A">
<title>הזמנה להתאמן ביחד · המחברת</title>
<meta property="og:title" content="הזמנה להתאמן ביחד במחברת">
<meta property="og:description" content="אפליקציה לרישום אימוני כוח. נרשמים דרך ההזמנה, ואתם חברים מיד.">
<style>
  :root { --bg: #16171A; --surface: #1F2024; --line: #2C2D33; --text: #F4F2EE; --muted: #A3A1A8; --accent: #F0A882; --on-accent: #16171A; }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; min-height: 100vh; min-height: 100svh; background: var(--bg); color: var(--text);
         font: 17px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Arial, sans-serif;
         display: flex; flex-direction: column;
         padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom)); }
  main { flex: 1; width: 100%; max-width: 400px; margin: 0 auto; display: flex; flex-direction: column; }
  .hero { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 32px 0; }
  .avatar { width: 128px; height: 128px; border-radius: 50%; background: var(--surface); color: var(--accent);
            box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--accent);
            display: flex; align-items: center; justify-content: center; font-size: 52px; font-weight: 700; overflow: hidden; margin-bottom: 28px; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  h1 { font-size: 30px; line-height: 1.15; letter-spacing: -0.02em; font-weight: 800; margin: 0 0 12px; text-wrap: balance; }
  .lead { margin: 0; color: var(--muted); max-width: 30ch; text-wrap: balance; }
  .actions { display: flex; flex-direction: column; gap: 4px; }
  .primary { display: flex; align-items: center; justify-content: center; min-height: 56px; padding: 0 28px; border-radius: 16px;
             background: var(--accent); color: var(--on-accent); font-size: 18px; font-weight: 700; text-decoration: none;
             transition: transform 120ms ease-out, filter 120ms ease-out; -webkit-tap-highlight-color: transparent; }
  .primary:active { transform: scale(0.98); filter: brightness(0.92); }
  .primary:focus-visible, .secondary:focus-visible { outline: 3px solid var(--text); outline-offset: 3px; }
  .secondary { display: flex; align-items: center; justify-content: center; min-height: 48px; color: var(--accent);
               font-size: 16px; font-weight: 600; text-decoration: none; border-radius: 12px; }
  .help { margin: 20px 0 0; padding-top: 20px; border-top: 1px solid var(--line); font-size: 14px; color: var(--muted); text-align: center; }
  .code { display: inline-block; margin-top: 8px; padding: 4px 12px; border-radius: 8px; background: var(--surface); color: var(--text);
          font: 600 15px/1.6 ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: 0.12em; direction: ltr; user-select: all; }
  .help strong { color: var(--text); font-weight: 600; }
  .hidden { display: none !important; }
  @media (prefers-reduced-motion: reduce) { .primary { transition: none; } }
</style>
</head>
<body>
<main>
  <section class="hero">
    <div class="avatar" id="avatar" aria-hidden="true"></div>
    <h1 id="title">הוזמנת להתאמן ביחד במחברת</h1>
    <p class="lead" id="lead">המחברת היא אפליקציה לרישום אימוני כוח. נרשמים דרך ההזמנה, ואתם חברים מיד.</p>
  </section>
  <div class="actions" id="actions">
    <a id="install" class="primary" href="https://testflight.apple.com/join/QfET88Zu">להתקנה</a>
    <a id="open" class="secondary" href="#">כבר מותקן? פתיחה</a>
    <p class="help">לא רואים את ההזמנה באפליקציה? במסך הפתיחה לוחצים על <strong>יש&nbsp;לך&nbsp;הזמנה&nbsp;מחברים?</strong> ומקלידים את הקוד:<br><span class="code" id="code"></span></p>
  </div>
</main>
<script>
  // While in beta: TestFlight. At launch: the App Store (https://apps.apple.com/app/id6830705009).
  var SUPABASE = "https://nsltxgarabyvupiingnl.supabase.co";
  var KEY = "sb_publishable_OCsyphZSmjZTCkPGHGiV1w_sZuvC7A1";
  var params = new URLSearchParams(location.search);
  var code = (params.get("c") || "").toUpperCase();
  var g = params.get("g") || "";
  var title = document.getElementById("title");
  var avatar = document.getElementById("avatar");
  avatar.textContent = "מ";

  if (!/^[A-Z0-9]{8}$/.test(code)) {
    title.textContent = "הקישור לא תקין";
    document.getElementById("lead").textContent = "אפשר לבקש ממי ששלח קישור חדש.";
    document.getElementById("open").classList.add("hidden");
    document.querySelector(".help").classList.add("hidden");
  } else {
    document.getElementById("code").textContent = code;
    document.getElementById("open").href = "thenotebook://invite/" + code + (g ? "?g=" + g : "");
    // The install loses this link: keep it on the clipboard, so the app can offer Paste.
    // In-app browsers (WhatsApp, Instagram) often have no navigator.clipboard: the old way first.
    document.getElementById("install").addEventListener("click", function () {
      var copied = false;
      try {
        var area = document.createElement("textarea");
        area.value = location.href; area.setAttribute("readonly", ""); area.style.position = "fixed"; area.style.opacity = "0";
        document.body.appendChild(area); area.select(); area.setSelectionRange(0, area.value.length);
        copied = document.execCommand("copy"); document.body.removeChild(area);
      } catch (e) {}
      if (!copied) { try { navigator.clipboard && navigator.clipboard.writeText(location.href); } catch (e) {} }
    });
    fetch(SUPABASE + "/rest/v1/rpc/get_invite", {
      method: "POST", headers: { "apikey": KEY, "Content-Type": "application/json" },
      body: JSON.stringify({ invite_token: code })
    }).then(function (r) { return r.json(); }).then(function (p) {
      if (!p || !p.id) return;
      var name = (p.display_name || p.username || "").trim().split(/\s+/)[0];
      if (!name) return;
      title.textContent = name + (g === "f" ? " מזמינה אותך להתאמן ביחד" : g === "m" ? " מזמין אותך להתאמן ביחד" : " שלח/ה לך הזמנה להתאמן ביחד");
      avatar.textContent = name.charAt(0);
      if (p.avatar_at) {
        var img = new Image();
        img.alt = "";
        img.onload = function () { avatar.textContent = ""; avatar.appendChild(img); };
        img.src = SUPABASE + "/storage/v1/object/public/avatars/" + p.id + ".jpg?v=" + encodeURIComponent(p.avatar_at);
      }
    }).catch(function () {});
  }
</script>
</body>
</html>
