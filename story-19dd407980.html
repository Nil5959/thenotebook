.ph{height:150px;border-radius:13px;background-size:cover;background-position:center}.phb{display:flex;gap:7px;margin-top:9px}.phb span{flex:1;text-align:center;background:rgba(240,168,130,.2);color:var(--accent);font-size:13px;font-weight:700;padding:9px;border-radius:999px}
.sec{background:#2C2D31;color:var(--accent);text-align:center;font-weight:800;font-size:15.5px;padding:13px;border-radius:999px;display:block}
.rec b{color:#E6C36A;font-size:13px}.rec p{margin:6px 0 0;font-size:14.5px}.done{background:var(--accent);color:#16171A;text-align:center;font-weight:800;padding:13px;border-radius:999px}
.pin{position:absolute;inset:auto 0 0;background:rgba(30,31,35,.94);padding:10px 14px 18px}.cta{all:unset;box-sizing:border-box;cursor:pointer;display:block;width:100%;text-align:center;background:var(--accent);color:#16171A;font-weight:900;font-size:17px;padding:15px;border-radius:999px}.cta:focus-visible{outline:2px solid #fff;outline-offset:2px}
.sheet2{background:#1C1C1E;padding:12px 10px 22px;gap:10px}.bar0{display:flex;align-items:center;justify-content:space-between;padding:0 4px}.icon{all:unset;cursor:pointer;width:34px;height:34px;display:grid;place-items:center;border-radius:50%;font-size:17px;color:#fff;background:rgba(255,255,255,.1)}.icon:focus-visible{outline:2px solid #fff}
.ttl{text-align:center;margin-top:-4px}.ttl small{color:#A9A7A3;font-size:13.5px}.ttl b{display:block;font-size:15.5px}.hint2{text-align:center;color:#A9A7A3;font-size:12.5px}
.pv{background-size:cover;background-position:center;align-items:center;justify-content:center;color:#fff}.pv.clear{background-image:conic-gradient(#33353a 25%,#26282c 0 50%,#33353a 0 75%,#26282c 0)!important;background-size:22px 22px}.pv .stg{zoom:1.42;width:auto;filter:drop-shadow(0 1px 3px rgba(0,0,0,.45))}.topb{position:absolute;inset:14px 14px auto;display:flex;justify-content:space-between;z-index:2}.topb .icon{background:rgba(0,0,0,.5)}
.bot{position:absolute;inset:auto 0 0;padding:12px 12px 16px;display:flex;flex-direction:column;gap:9px;background:linear-gradient(transparent,rgba(0,0,0,.72) 30%)}.nav{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:14.5px}.nav .icon{background:rgba(0,0,0,.5)}.inks{display:flex;justify-content:center;gap:12px}.ink{all:unset;cursor:pointer;width:27px;height:27px;border-radius:50%;border:2px solid transparent;outline:1px solid rgba(255,255,255,.45)}.ink[aria-pressed=true]{border-color:var(--accent);outline:2px solid var(--accent)}
.acts{display:flex;gap:8px}.acts button{all:unset;cursor:pointer;flex:1;text-align:center;padding:13px;border-radius:999px;font-weight:800;font-size:15px}.acts .copy{background:var(--accent);color:#16171A}.acts .share{background:#fff;color:#111}.acts .opt{background:rgba(0,0,0,.55);color:#fff;font-size:13px;padding:9px}.sheet2 .stg{zoom:.82}.acts button:focus-visible{outline:2px solid #fff}
.toast{position:absolute;inset:auto 16px 200px;background:#fff;color:#111;font-weight:700;text-align:center;padding:11px;border-radius:14px;font-size:14px;z-index:3}
.note2{max-width:460px;margin:12px auto 0;color:var(--muted);font-size:14px;line-height:1.55;text-align:center}
#fun2{display:flex;flex-direction:column;gap:8px}

body{padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:#121214}
